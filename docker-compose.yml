name: homeservice

# Uses an already-running Postgres container on the host (published on
# 5432) instead of provisioning its own - see the `homeservice` database
# created there. `host.docker.internal` is how a container reaches the host
# from inside the compose network; `host-gateway` is what resolves it on
# Linux.
services:
  # Runs once per `up`, applies prisma/migrations, then exits - the app waits
  # for it to finish so it never talks to a database that is a migration
  # behind. Built from the `builder` stage because this needs the Prisma CLI.
  migrate:
    build:
      context: .
      target: builder
    image: homeservice-tooling
    container_name: homeservice-migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://appuser:${DB_PASSWORD:?set DB_PASSWORD in .env - see .env.example}@host.docker.internal:5432/homeservice?schema=public&sslmode=require
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  app:
    build:
      context: .
    image: homeservice-api
    container_name: homeservice-api
    restart: unless-stopped
    environment:
      # Left off "production" until the SMS provider in auth.sms.ts is wired
      # up - production mode makes OTP requests throw instead of sending,
      # since there's no real provider to send through yet.
      NODE_ENV: development
      # The port inside the container; the host side is set under `ports`.
      PORT: 3000
      DATABASE_URL: postgresql://appuser:${DB_PASSWORD:?set DB_PASSWORD in .env - see .env.example}@host.docker.internal:5432/homeservice?schema=public&sslmode=require
      # Read from .env (or the shell). Deliberately has no default: a shared
      # secret in a committed file is the same as no secret at all.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - see .env.example}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      # Matches the volume below. Files uploaded during signup live here, and
      # the app serves them back under /uploads.
      UPLOAD_DIR: /app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Uploads are the one thing this container writes. Without a volume every
      # redeploy would throw away the technicians' documents along with the
      # old image, and the URLs stored in the database would 404.
      - uploads:/app/uploads
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Off by default; run it with:
  #   docker compose --profile seed run --rm seed
  seed:
    extends:
      service: migrate
    container_name: homeservice-seed
    profiles: ["seed"]
    command: ["npx", "prisma", "db", "seed"]

volumes:
  # Survives `docker compose down` and every redeploy. Remove it and the
  # technicians' uploaded documents go with it.
  uploads:
