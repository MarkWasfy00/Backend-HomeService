name: homeservice

services:
  postgres:
    image: postgres:17-alpine
    container_name: homeservice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homeservice
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homeservice"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runs once per `up`, applies prisma/migrations, then exits - the app waits
  # for it to finish so it never talks to a database that is a migration
  # behind. Built from the `builder` stage because this needs the Prisma CLI.
  migrate:
    build:
      context: .
      target: builder
    image: homeservice-tooling
    container_name: homeservice-migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/homeservice?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
    image: homeservice-api
    container_name: homeservice-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # The port inside the container; the host side is set under `ports`.
      PORT: 3000
      # `postgres` is the service name above, not localhost - inside the
      # compose network that is what resolves to the database. No sslmode,
      # because this Postgres speaks plaintext on a private network.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/homeservice?schema=public
      # Read from .env (or the shell). Deliberately has no default: a shared
      # secret in a committed file is the same as no secret at all.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - see .env.example}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Off by default; run it with:
  #   docker compose --profile seed run --rm seed
  seed:
    extends:
      service: migrate
    container_name: homeservice-seed
    profiles: ["seed"]
    command: ["npx", "prisma", "db", "seed"]

volumes:
  postgres-data:
